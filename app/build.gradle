plugins {
    alias(libs.plugins.android.application)
}

// Google Services se aplica cuando google-services.json existe dentro de app/.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Propiedades locales para las credenciales MQTT.
Properties local = new Properties()
File localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream {
        local.load(it)
    }
}

def safe = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"')
}

def mqttUri = safe(local.getProperty('MQTT_URI', ''))
def mqttUser = safe(local.getProperty('MQTT_USERNAME', ''))
def mqttPass = safe(local.getProperty('MQTT_PASSWORD', ''))

android {
    namespace 'com.example.comunidadwestern'
    compileSdk 37

    defaultConfig {
        applicationId 'com.example.comunidadwestern'
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'MQTT_URI', '"' + mqttUri + '"'
        buildConfigField 'String', 'MQTT_USERNAME', '"' + mqttUser + '"'
        buildConfigField 'String', 'MQTT_PASSWORD', '"' + mqttPass + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.core

    // Firebase: sin Cloud Functions para mantener el proyecto en Spark.
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'

    // MQTT Paho
    implementation libs.paho
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.github.hannesa2:paho.mqtt.android:3.6.6'

    testImplementation libs.junit
}
